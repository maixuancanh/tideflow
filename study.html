<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#126a76"/><title>Tideflow — Live Harbor Operations</title><style>body{margin:0;background:#123f49}body[data-launch="loading"] #scene,body[data-launch="loading"] #interface>*:not(#loading){visibility:hidden}#loading[hidden],#loading [hidden]{display:none!important}body[data-launch="loading"] #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#123f49 url(/study/loading-harbor.png) center/cover;color:#fff8e6;z-index:200}body[data-launch="loading"] .launch-logo{width:min(680px,88vw);max-height:240px;object-fit:contain;filter:brightness(0) invert(1) drop-shadow(0 8px 26px #092e3877)}</style></head><body data-launch="loading"><canvas id="scene" tabindex="-1" aria-label="3D harbor scene. Drag to orbit and scroll to zoom."></canvas><div id="interface"><header><div class="wordmark"><img src="/brand/tideflow-logo.png" alt="Tideflow"/></div><button id="reference">Concept</button></header><div id="loading"><img class="launch-logo" src="/brand/tideflow-logo.png" alt="Tideflow"/><progress value="0" max="100" aria-label="Loading progress"></progress><span id="launch-status">Loading harbor</span><small id="launch-tip"></small><form id="launch-profile" hidden><label for="launch-username">Captain name</label><input id="launch-username" maxlength="24" autocomplete="nickname" placeholder="Enter username" required/><button type="submit">Create profile</button></form><button id="launch-play" hidden>PLAY</button><button id="launch-retry" hidden>Retry</button></div><footer><div class="caption"><span class="kicker">CORAL HARBOR</span><span>Run the live flow.</span><small>Onchain signals become visible operations.</small></div><div class="controls legacy-controls"><button id="home">Overview</button><button id="detail">Vessel view</button><button id="pause" aria-pressed="false">Pa
